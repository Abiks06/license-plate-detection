<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlateSight · On-device license plate reader</title>

    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The hero demo's first image is the desktop LCP; JS would only discover it after samples.json. -->
    <link rel="preload" href="/samples/sample-101-hero.webp" as="image" type="image/webp" fetchpriority="high" media="(min-width: 1024px)" />
    <link rel="preload" href="/samples/samples.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/model/models.json" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
